name: Build EduVault APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build APK
        run: |
          mkdir buildsrc
          unzip -q EduVault_Android_Build_CORRECTED.zip -d buildsrc
          cd buildsrc
          flutter create . --platforms=android
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eduvault-apk
          path: buildsrc/build/app/outputs/flutter-apk/app-release.apkname: Build EduVault APK


name: Build EduVault APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract EduVault
        run: |
          mkdir source_app
          unzip -q EduVault_Nokia_C22_UNIVERSAL_FIX.zip -d source_app

      - name: Build APK
        working-directory: source_app
        run: |
          flutter create . --platforms=android
          flutter pub get
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eduvault-nokia-c22-universal-apk
          path: source_app/build/app/outputs/flutter-apk/app-debug.apk

name: Build EduVault C22 APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android platform
        run: flutter create . --project-name eduvault --platforms=android

      - name: Get dependencies
        run: flutter pub get

      - name: Build ARM32 APK
        run: flutter build apk --debug --target-platform android-arm

      - name: Save ARM32 APK
        uses: actions/upload-artifact@v4
        with:
          name: eduvault-c22-arm32-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Build ARM64 APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Save ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: eduvault-c22-arm64-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

name: Build EduVault Admin Dashboard APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android platform
        run: flutter create . --project-name eduvault --platforms=android

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug --target-platform android-arm,android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eduvault-admin-dashboard-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
